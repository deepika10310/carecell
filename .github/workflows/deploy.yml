name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la
          find . -name Dockerfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Backend Image

      - name: Build Backend Image
        run: |
          docker build -t carecell-backend ./backend

      - name: Tag Backend Image
        run: |
          docker tag carecell-backend:latest \
          ${{ steps.login-ecr.outputs.registry }}/carecell-backend:latest

      - name: Push Backend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/carecell-backend:latest

      # Frontend Image

      - name: Build Frontend Image
        run: |
          docker build -t carecell-frontend ./frontend

      - name: Tag Frontend Image
        run: |
          docker tag carecell-frontend:latest \
          ${{ steps.login-ecr.outputs.registry }}/carecell-frontend:latest

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/carecell-frontend:latest

      # Deploy to EC2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-2 | \
            docker login --username AWS --password-stdin \
            ${{ steps.login-ecr.outputs.registry }}

            cd /home/ubuntu/carecell

            docker compose pull

            docker compose up -d